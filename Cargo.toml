[package]
name = "nekosportsworldtool"
version = "0.4.2"
edition = "2021"
description = "NekoSportsWorldTool：运动世界校园版协议自动化工具（GUI + CLI）"
license = "CC-BY-NC-4.0"
repository = "https://github.com/YanamiNeko/NekoSportsWorldTool"

[workspace]
members = [".", "crates/route-planner"]
resolver = "2"

[lib]
crate-type = ["rlib", "cdylib"]

[patch.crates-io]
# NativeActivity must release its event loop on Destroy and allow recreation.
winit = { path = "vendor/winit-0.30.13" }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd"]
android = ["gui", "eframe/android-native-activity", "dep:android-activity", "dep:android_logger", "dep:jni", "dep:log", "dep:winit"]

[dependencies]
route-planner = { path = "crates/route-planner" }
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }
egui_extras = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
rsa = "0.9"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
rand_distr = "0.4"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# rfd 无 Android 后端，仅在桌面目标编译（调用点 osm.rs 已按 cfg 门控）
rfd = { version = "0.15", optional = true }
# 不能用 native-certs：它会用系统证书库**替换**掉 ureq "tls" feature 内置的
# Mozilla 根证书（webpki-roots）。rustls-native-certs 在 Windows 上只读
# HKCU\ROOT，该存储被精简或清空时列表为空，所有 HTTPS 都会失败并报
# "invalid peer certificate: UnknownIssuer"。上层 [dependencies] 的
# ["json","tls"] 已提供内置根证书，此处不再引入 native-certs。
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"], optional = true }
android_logger = { version = "0.14", optional = true }
jni = { version = "0.21", optional = true }
log = { version = "0.4", optional = true }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
incremental = false

[profile.dev]
debug = "line-tables-only"
